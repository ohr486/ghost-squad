services:
  # PostgreSQL Database Container
  db:
    image: postgres:15-alpine
    container_name: gs-db
    environment:
      POSTGRES_DB: gs_db
      POSTGRES_USER: gs_user
      POSTGRES_PASSWORD: gs_password
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/sql/init:/docker-entrypoint-initdb.d
    networks:
      - gs-network

  # API Container
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gs-api
    environment:
      - DATABASE_URL=postgresql://gs_user:gs_password@db:5432/gs_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=true
      - ENVIRONMENT=development
      # IMAP設定
      - IMAP_SERVER=${IMAP_SERVER}
      - IMAP_USERNAME=${IMAP_USERNAME}
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      # Anthropic API（オプション）
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    networks:
      - gs-network
    depends_on:
      - db

  # Web Container
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: gs-web
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - REACT_APP_ENVIRONMENT=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    networks:
      - gs-network
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    driver: local

networks:
  gs-network:
    driver: bridge
