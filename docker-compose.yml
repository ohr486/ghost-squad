version: '3.8'

services:
  # --- The Brain (Backend) ---
  api:
    build: ./apps/api
    container_name: ghost-api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    environment:
      - DATABASE_URL=postgresql://ghost:squad_password@db:5432/ghost_memory
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # --- Living Kanban (Frontend) ---
  web:
    build: ./apps/web
    container_name: ghost-web
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    command: npm run dev

  # --- Shared Ghost-Memory (Database) ---
  db:
    image: postgres:15-alpine
    container_name: ghost-db
    environment:
      - POSTGRES_USER=ghost
      - POSTGRES_PASSWORD=squad_password
      - POSTGRES_DB=ghost_memory
    ports:
      - "5432:5432"
    volumes:
      - ghost_db_data:/var/lib/postgresql/data

  # --- Task Queue & State (Cache) ---
  redis:
    image: redis:alpine
    container_name: ghost-redis
    ports:
      - "6379:6379"

  # --- Ghost-Terminal (CLI) ---
  cli:
    build: ./apps/cli
    container_name: ghost-cli
    environment:
      - API_URL=http://api:8000/
    depends_on:
      - api
    # TUIを表示するためにTTYを有効化
    tty: true
    stdin_open: true

volumes:
  ghost_db_data:
