version: '3.8'

services:
  # PostgreSQL Database Container
  db:
    image: postgres:15-alpine
    container_name: ghost-squad-db
    environment:
      POSTGRES_DB: ghost_squad
      POSTGRES_USER: ghost_squad_user
      POSTGRES_PASSWORD: ghost_squad_password
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init:/docker-entrypoint-initdb.d
    networks:
      - ghost-squad-network

  # Redis Cache Container
  redis:
    image: redis:7-alpine
    container_name: ghost-squad-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ghost-squad-network
    command: redis-server --appendonly yes

  # Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghost-squad-backend
    environment:
      - DATABASE_URL=postgresql://ghost_squad_user:ghost_squad_password@db:5432/ghost_squad
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=true
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - ghost-squad-network
    depends_on:
      - db
      - redis

  # Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ghost-squad-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_ENVIRONMENT=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ghost-squad-network
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ghost-squad-network:
    driver: bridge